version: "3.9"

services:
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: always

    env_file:
      - ./env/pgadmin.env

    ports:
      - "5050:80"

    volumes:
      - ./volumes/pgadmin-data:/var/lib/pgadmin

    networks:
      - pg_network

networks:
  pg_network:
    driver: bridge
